<div class="row">
  <div class="col">
    <div class="alert alert-warning">
      {{ date | date : "full" | uppercase }}
    </div>
    <app-list [cvs]="cvs() ?? []"></app-list>
  </div>
  <div class="col">
    <app-cv-card [cv]="selectedCv()"></app-cv-card>
  </div>
</div>
<!-- @defer: defers loading of embauche component until it enters viewport -->
<!-- this improves initial page load by not loading the pre-hired list immediately -->
@defer (on viewport; prefetch on idle) {
  <app-embauche></app-embauche>
} @placeholder {
  <!-- placeholder shown before component enters viewport -->
  <div class="alert alert-light mt-2 text-center text-muted">
    <i class="bi bi-people"></i>
    Liste des pré-embauchés
  </div>
} @loading (minimum 300ms) {
  <!-- loading state with minimum duration to prevent flash -->
  <div class="alert alert-info mt-2 text-center">
    <span class="spinner-border spinner-border-sm me-2" role="status"></span>
    Chargement des pré-embauchés...
  </div>
}
